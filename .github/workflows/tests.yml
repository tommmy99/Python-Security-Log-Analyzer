
name: Python Tests

on:
  push:
    branches: [main, improve-log-analyzer]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest -v

      - name: Run sample analysis
        run: python log_analyzer.py sample_logs.csv
